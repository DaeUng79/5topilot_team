services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: simsa
      POSTGRES_DB: simsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - simsa-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simsa -d simsa"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  simsa-data:
