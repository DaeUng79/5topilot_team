name: team-ci
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
permissions:
  contents: read
concurrency:
  group: team-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web_cookiesh1/package-lock.json
      - name: Install committee dependencies
        run: python -m pip install -r apps/committee_Lex6won/requirements-dev.lock
      - name: Install web dependencies
        working-directory: apps/web_cookiesh1
        run: npm ci
      - name: Python style
        working-directory: apps/committee_Lex6won
        run: |
          ruff check .
          ruff format --check committee_app tests migrations *.py
      - name: Committee tests
        working-directory: apps/committee_Lex6won
        run: pytest -q
      - name: Web checks and build
        working-directory: apps/web_cookiesh1
        run: |
          npm run check
          npm run build
