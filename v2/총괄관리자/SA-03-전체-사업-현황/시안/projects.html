<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체 사업 현황 · 심사임당 총괄관리자</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../_shell.css">
<style>
td .lock{display:block;font-size:var(--t-base);color:var(--text-3);font-weight:400}
td.nm{max-width:360px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:var(--t-base);color:var(--text-3)}
.steps li::before{content:"";height:8px;border-radius:var(--radius-full);background:var(--gray-10)}
.steps li.done::before{background:var(--primary-50)}
.steps li.now{color:var(--primary-60);font-weight:700}
.steps li.now::before{background:var(--primary-50);box-shadow:0 0 0 3px var(--primary-10)}
.steps li.done{color:var(--text-2)}
.prog{margin-top:12px;font-size:var(--t-base);color:var(--text-2)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.hist li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--t-base)}
.hist li:last-child{border:0}
.hist time{color:var(--text-3)}
.hist b{display:block}
.hist span{color:var(--text-3)}
.lockbar{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--radius-sm);background:var(--warning-5);border:1px solid var(--warning-10);font-weight:700;font-size:var(--t-body)}
.edit-in{min-height:40px}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <button class="brand" type="button" data-href="../../SA-01-대시보드/시안/dashboard.html" aria-label="심사임당 대시보드로"><span class="brand-mark">심</span><span>심사임당</span></button>
  <p class="role">총괄관리자</p>
  <nav aria-label="주 메뉴">
    <a href="../../SA-01-대시보드/시안/dashboard.html">대시보드</a>
    <a href="../../SA-02-부서-관리/시안/departments.html">부서·계정</a>
    <a href="../../SA-03-전체-사업-현황/시안/projects.html" aria-current="page">전체 사업</a>
    <a href="../../SA-04-자료-관리/시안/data.html">자료 관리</a>
  </nav>
  <div class="bottom">
    <a href="../../SA-00-로그인-권한/시안/login.html#account" data-account>내 계정</a>
    <a href="../../SA-00-로그인-권한/시안/login.html" data-logout>로그아웃</a>
  </div>
</aside>
<div class="main">
  <header class="head">
    <div><h1>전체 사업</h1><p class="sub">모든 부서의 사업을 한눈에 봐요. 평가가 시작된 사업은 고칠 수 없어요.</p></div>
  </header>
  <div class="body">
    <section class="card" aria-label="사업 목록">
      <div class="toolbar">
        <label class="sel-wrap">부서
          <select id="f-dept" aria-label="부서로 거르기"><option value="">전체 부서</option></select></label>
        <div class="chips" role="group" aria-label="상태로 거르기" id="f-status">
          <button class="chip" type="button" data-s="" aria-pressed="true">전체</button>
          <button class="chip" type="button" data-s="준비" aria-pressed="false">준비</button>
          <button class="chip" type="button" data-s="평가 중" aria-pressed="false">평가 중</button>
          <button class="chip" type="button" data-s="완료" aria-pressed="false">완료</button>
        </div>
        <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input type="search" id="q" placeholder="사업명 검색" aria-label="사업명 검색"></div>
        <span class="count" id="count"></span>
      </div>
      <div class="tbl-wrap" id="wrap">
        <table>
          <thead><tr><th>사업명</th><th>부서</th><th>담당자</th><th>평가일</th><th>상태</th><th class="num">제출</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="state" id="none" hidden><div class="ico" aria-hidden="true">?</div><strong>맞는 사업이 없어요</strong><p>부서나 상태를 바꾸거나 검색어를 지워 보세요.</p></div>
      </div>
    </section>
  </div>
  <div class="demo"><b>시안 보기</b><span class="muted">행을 누르면 오른쪽에 자세히 나와요 · 🔒 표시 사업은 수정·삭제 버튼이 없어요 · 준비 단계 사업만 수정·삭제</span></div>
</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="scrim top" id="scrim2"></div>

<aside class="drawer" id="p" role="dialog" aria-modal="true" aria-labelledby="p-t">
  <header><h2 id="p-t"></h2><button class="x" type="button" data-close aria-label="닫기">×</button></header>
  <div class="dbody" id="p-body"></div>
  <footer id="p-foot"></footer>
</aside>

<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-b">
  <h2 id="dlg-t"></h2><p id="dlg-b"></p>
  <div class="acts"><button class="btn" type="button" id="dlg-cancel" data-close>취소</button><button class="btn danger" type="button" id="dlg-ok"></button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200)}
const stack=[];
function openLayer(el,focusSel){const sc=el.classList.contains('dlg')?$('#scrim2'):$('#scrim');stack.push({el,sc,from:document.activeElement});sc.classList.add('on');el.classList.add('on');
  setTimeout(()=>{const f=(focusSel&&$(focusSel,el))||el.querySelector('input:not([disabled]),select,button:not([disabled])');f&&f.focus()},60)}
function closeLayer(el){const i=stack.findIndex(l=>l.el===el);if(i<0)return;const l=stack.splice(i,1)[0];l.el.classList.remove('on');l.sc.classList.remove('on');
  if(l.from&&document.contains(l.from)&&l.from.focus)l.from.focus()}
document.addEventListener('keydown',e=>{
  if(!stack.length)return;const top=stack[stack.length-1].el;
  if(e.key==='Escape'){e.preventDefault();closeLayer(top)}
  if(e.key==='Tab'){const f=$$('input:not([disabled]),select,button:not([disabled]),[tabindex="0"]',top).filter(x=>x.offsetParent!==null||x===document.activeElement);
    if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
$('#scrim')&&$('#scrim').addEventListener('click',()=>{const l=stack.filter(x=>x.sc.id==='scrim').pop();l&&closeLayer(l.el)});
$('#scrim2')&&$('#scrim2').addEventListener('click',()=>{const l=stack.filter(x=>x.sc.id==='scrim2').pop();l&&closeLayer(l.el)});
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>closeLayer(b.closest('.drawer,.dlg'))));
$$('[data-href]').forEach(b=>b.addEventListener('click',()=>{location.href=b.dataset.href}));
function rowKey(tr,fn){tr.addEventListener('click',fn);tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}
function confirmDlg({title,body,ok,danger=true,onOk}){const d=$('#dlg');$('#dlg-t').textContent=title;$('#dlg-b').textContent=body;const b=$('#dlg-ok');b.textContent=ok;b.className='btn '+(danger?'danger':'primary');
  b.onclick=()=>{closeLayer(d);onOk&&onOk()};openLayer(d,'#dlg-cancel')}

const D=['(가상)정보화담당관','(가상)기획예산담당관','(가상)총무과','(가상)시설관리과','(가상)복지정책과','(가상)교통행정과'];
let P=[
 {id:1,name:'(가상) 통합 민원 시스템 구축 용역',dept:D[0],owner:'김가상',pos:'주무관',tel:'010-0000-2101',date:'2026-11-05',s:'준비',sub:0,N:5},
 {id:2,name:'(가상) 청사 CCTV 교체 사업',dept:D[3],owner:'이나상',pos:'주무관',tel:'010-0000-2102',date:'2026-10-28',s:'평가 중',sub:3,N:5},
 {id:3,name:'(가상) 시민 앱 고도화 용역',dept:D[0],owner:'박다상',pos:'팀장',tel:'010-0000-2103',date:'2026-10-20',s:'평가 중',sub:5,N:7},
 {id:4,name:'(가상) 복지 대상자 통합 관리 시스템',dept:D[4],owner:'최라상',pos:'주무관',tel:'010-0000-2104',date:'2026-09-30',s:'완료',sub:5,N:5},
 {id:5,name:'(가상) 버스 정보 안내 단말 구매',dept:D[5],owner:'정마상',pos:'주무관',tel:'010-0000-2105',date:'2026-11-12',s:'준비',sub:0,N:5},
 {id:6,name:'(가상) 예산 편성 시스템 개선',dept:D[1],owner:'강바상',pos:'팀장',tel:'010-0000-2106',date:'2026-11-18',s:'준비',sub:0,N:7},
 {id:7,name:'(가상) 전자문서 보관소 구축',dept:D[2],owner:'윤사상',pos:'주무관',tel:'010-0000-2107',date:'2026-09-14',s:'완료',sub:7,N:7},
 {id:8,name:'(가상) 공공 와이파이 확대 사업',dept:D[0],owner:'장아상',pos:'주무관',tel:'010-0000-2108',date:'2026-10-24',s:'평가 중',sub:0,N:5},
 {id:9,name:'(가상) 주차 정보 시스템 개선',dept:D[5],owner:'임자상',pos:'팀장',tel:'010-0000-2109',date:'2026-12-02',s:'준비',sub:0,N:5},
 {id:10,name:'(가상) 시설 안전 점검 앱 개발',dept:D[3],owner:'한차상',pos:'주무관',tel:'010-0000-2110',date:'2026-08-27',s:'완료',sub:5,N:5},
 {id:11,name:'(가상) 업무 포털 개편 용역',dept:D[2],owner:'오카상',pos:'주무관',tel:'010-0000-2111',date:'2026-11-25',s:'준비',sub:0,N:5},
 {id:12,name:'(가상) 돌봄 서비스 신청 시스템',dept:D[4],owner:'서타상',pos:'팀장',tel:'010-0000-2112',date:'2026-10-22',s:'평가 중',sub:2,N:5},
];
const hist={1:[['2026-10-12','김가상 (부서)','평가일을 11-05로 바꿨어요'],['2026-10-08','김가상 (부서)','사업을 만들었어요']],
 2:[['2026-10-14','이나상 (부서)','평가를 시작했어요'],['2026-10-10','이나상 (부서)','위원 명단을 확정했어요'],['2026-10-02','이나상 (부서)','사업을 만들었어요']]};
const defHist=r=>[['2026-10-0'+(r.id%8+1),r.owner+' (부서)','사업을 만들었어요']];
const st={'준비':'info','평가 중':'primary','완료':'success'};
const mark={'준비':'○','평가 중':'●','완료':'✓'};
const locked=r=>r.s!=='준비';
const lockMsg=r=>r.s==='평가 중'?'평가 중이라 수정할 수 없어요':'평가가 끝나 수정할 수 없어요';
let fs='',fd='',q='';
D.forEach(d=>$('#f-dept').insertAdjacentHTML('beforeend',`<option>${d}</option>`));
function list(){return P.filter(r=>(!fd||r.dept===fd)&&(!fs||r.s===fs)&&(!q||r.name.includes(q)))}
function render(){const L=list();$('#count').textContent=L.length+'개 사업';$('#none').hidden=L.length>0;$('table').hidden=!L.length;
  $('#rows').innerHTML=L.map(r=>`<tr tabindex="0" data-id="${r.id}" aria-label="${h(r.name)} 자세히 보기"><td class="strong nm">${locked(r)?'<span role="img" aria-label="잠김">🔒</span> ':''}${h(r.name)}${locked(r)?`<span class="lock">${lockMsg(r)}</span>`:''}</td><td>${h(r.dept)}</td><td>${h(r.owner)}</td><td class="tnum">${r.date}</td><td><span class="badge ${st[r.s]}">${mark[r.s]} ${r.s}</span></td><td class="num tnum">${r.sub}/${r.N}</td></tr>`).join('');
  $$('#rows tr').forEach(tr=>rowKey(tr,()=>openP(+tr.dataset.id)))}
$('#f-dept').onchange=e=>{fd=e.target.value;render()};
$('#q').oninput=e=>{q=e.target.value.trim();render()};
$$('#f-status .chip').forEach(c=>c.onclick=()=>{fs=c.dataset.s;$$('#f-status .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render()});
let cur=null;
function body(r,edit){
  const step=['준비','평가 중','완료'],ix=step.indexOf(r.s);
  const info=edit?`<label class="field">사업명<input id="x-name" class="edit-in" value="${h(r.name)}"></label><label class="field">담당자<input id="x-owner" class="edit-in" value="${h(r.owner)}"></label><label class="field">평가일<input id="x-date" class="edit-in" type="date" value="${r.date}"></label>`
   :`<dl class="kv"><dt>사업명</dt><dd>${h(r.name)}</dd><dt>부서</dt><dd>${h(r.dept)}</dd><dt>담당자</dt><dd>${h(r.owner)} · ${r.pos}</dd><dt>연락처</dt><dd class="tnum">${r.tel}</dd><dt>평가일</dt><dd class="tnum">${r.date}</dd><dt>위원</dt><dd>${r.N}명</dd></dl>`;
  const H=(hist[r.id]||defHist(r)).map(x=>`<li><time>${x[0]}</time><div><b>${h(x[2])}</b><span>${h(x[1])}</span></div></li>`).join('');
  return `${locked(r)?`<div class="lockbar"><span role="img" aria-label="잠김">🔒</span> ${lockMsg(r)}</div>`:''}
  <section><h3 class="sec-h">사업 정보</h3>${edit?'<div style="display:flex;flex-direction:column;gap:16px">'+info+'</div>':info}</section>
  <section><h3 class="sec-h">진행 단계</h3><ol class="steps">${step.map((s,i)=>`<li class="${i<ix?'done':i===ix?'now':''}"${i===ix?' aria-current="step"':''}>${i<ix?'✓ ':i===ix?'● ':''}${s}${i<ix?' (끝)':i===ix?' (지금)':''}</li>`).join('')}</ol>
   ${r.s==='평가 중'?`<p class="prog">점수 제출 <b class="tnum">${r.sub}/${r.N}</b>명</p>`:''}${r.s==='완료'?`<p class="prog">점수 제출 <b class="tnum">${r.sub}/${r.N}</b>명 · 결과 확인까지 끝났어요</p>`:''}</section>
  <section><h3 class="sec-h">변경 이력</h3><ul class="hist">${H}</ul></section>`}
function foot(r,edit){
  if(locked(r))return '<button class="btn" type="button" data-close>닫기</button>';
  if(edit)return '<button class="btn" type="button" id="b-cancel">취소</button><button class="btn primary" type="button" id="b-save">저장</button>';
  return '<button class="btn text-danger" type="button" id="b-del" style="margin-right:auto">삭제</button><button class="btn primary" type="button" id="b-edit">수정</button>'}
function paint(r,edit){$('#p-t').textContent=edit?'사업 수정':r.name;$('#p-body').innerHTML=body(r,edit);$('#p-foot').innerHTML=foot(r,edit);
  $$('#p-foot [data-close]').forEach(b=>b.onclick=()=>closeLayer($('#p')));
  const g=id=>document.getElementById(id);
  g('b-edit')&&(g('b-edit').onclick=()=>{paint(r,true);g('x-name').focus()});
  g('b-cancel')&&(g('b-cancel').onclick=()=>paint(r,false));
  g('b-save')&&(g('b-save').onclick=()=>{r.name=g('x-name').value.trim()||r.name;r.owner=g('x-owner').value.trim()||r.owner;r.date=g('x-date').value||r.date;(hist[r.id]=hist[r.id]||defHist(r)).unshift([new Date().toISOString().slice(0,10),'김가상 (총괄)','사업 정보를 고쳤어요']);paint(r,false);render();toast('저장하고 기록을 남겼어요')});
  g('b-del')&&(g('b-del').onclick=()=>confirmDlg({title:'‘'+r.name+'’을 삭제할까요?',body:'폐기 상태로 바꾸고 기록을 남겨요. 목록에서는 보이지 않게 돼요.',ok:'삭제',onOk:()=>{P=P.filter(x=>x!==r);closeLayer($('#p'));render();toast('폐기 상태로 바꾸고 기록을 남겼어요')}}))}
function openP(id){cur=P.find(x=>x.id===id);paint(cur,false);openLayer($('#p'),'.x')}
render();
const m=location.hash.match(/#open=(\d+)/);if(m)setTimeout(()=>openP(+m[1]),50);
</script>
</body>
</html>
