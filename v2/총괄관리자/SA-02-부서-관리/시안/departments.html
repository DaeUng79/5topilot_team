<link rel="stylesheet" href="../../_shell.css">
<style>
.zone{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:12px}

<div class="app">
<aside class="side">
  <button class="brand" type="button" data-href="../../SA-01-대시보드/시안/dashboard.html" aria-label="심사임당 대시보드로"><span class="brand-mark">심</span><span>심사임당</span></button>
  <p class="role">총괄관리자</p>

    <a href="../../SA-01-대시보드/시안/dashboard.html">대시보드</a>

<div class="main">
  <header class="head">
    <div><h1>부서·계정</h1><p class="sub" id="sub"></p></div>
    <button class="btn primary" id="btn-new" type="button"></button>
  </header>
  <div class="body">
    <section class="card" aria-label="부서와 관리자 계정">
      <div class="tabs" role="tablist" aria-label="보기 고르기">
        <button class="tab" role="tab" id="t-dept" aria-controls="pn-dept" aria-selected="true" type="button">부서</button>
        <button class="tab" role="tab" id="t-acc" aria-controls="pn-acc" aria-selected="false" type="button" tabindex="-1">관리자 계정</button>
      </div>
      <div class="pn" id="pn-dept" role="tabpanel" aria-labelledby="t-dept">
        <div class="toolbar"><span class="count" style="margin-left:0" id="d-count"></span></div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>부서 코드</th><th>소속</th><th>명칭</th><th class="num">계정 수</th><th class="num">사업 수</th><th>상태</th></tr></thead>
          <tbody id="d-rows"></tbody></table></div>
      </div>
      <div class="pn" id="pn-acc" role="tabpanel" aria-labelledby="t-acc" hidden>
        <div class="toolbar">
          <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="a-q" type="search" placeholder="아이디나 부서로 찾기" aria-label="계정 찾기" autocomplete="off"></div>
          <span class="count" id="a-count"></span>
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>아이디</th><th>부서</th><th>권한</th><th>마지막 로그인</th><th>상태</th></tr></thead>
          <tbody id="a-rows"></tbody></table>
          <div class="state" id="a-none" hidden><strong>찾는 계정이 없어요</strong><p>다른 아이디나 부서로 찾아 보세요.</p></div></div>
      </div>
    </section>
  </div>
  <div class="demo"><b>시안 보기</b>
    <button type="button" id="d-conf" aria-pressed="false">저장할 때 충돌 나게</button>
    <span class="muted">· 행을 누르면 수정 칸이 열려요 · 사업이 있는 부서는 삭제 대신 비활성</span>
  </div>
</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="scrim top" id="scrim2"></div>

<!-- 부서 등록 -->
<aside class="drawer" id="p-dnew" role="dialog" aria-modal="true" aria-labelledby="p-dnew-t">
  <header><h2 id="p-dnew-t">부서 등록</h2><button class="x" type="button" data-close aria-label="닫기">×</button></header>
  <form class="dbody" id="f-dnew" novalidate>
    <label class="field">부서 코드 <span class="hint">영문 대문자·숫자·붙임표 3~12자</span>
      <input id="dn-code" autocomplete="off" placeholder="예) D-111" aria-describedby="dn-code-e"><span class="err" id="dn-code-e" hidden></span></label>
    <label class="field">소속 <span class="hint">기관 이름</span>
      <input id="dn-org" autocomplete="off" placeholder="예) (가상)시청" aria-describedby="dn-org-e"><span class="err" id="dn-org-e" hidden></span></label>
    <label class="field">명칭
      <input id="dn-name" autocomplete="off" placeholder="예) 정보화담당관" aria-describedby="dn-name-e"><span class="err" id="dn-name-e" hidden></span></label>
  </form>
  <footer><button class="btn" type="button" data-close>취소</button><button class="btn primary" type="submit" form="f-dnew">등록</button></footer>
</aside>

<!-- 부서 수정 -->
<aside class="drawer" id="p-dedit" role="dialog" aria-modal="true" aria-labelledby="p-dedit-t">
  <header><h2 id="p-dedit-t">부서 수정</h2><button class="x" type="button" data-close aria-label="닫기">×</button></header>
  <div class="dbody">
    <div id="de-status"></div>
    <label class="field">부서 코드 <span class="hint">코드는 바꿀 수 없어요</span><input id="de-code" disabled></label>
    <label class="field">소속<input id="de-org" autocomplete="off" aria-describedby="de-org-e"><span class="err" id="de-org-e" hidden></span></label>
    <label class="field">명칭<input id="de-name" autocomplete="off" aria-describedby="de-name-e"><span class="err" id="de-name-e" hidden></span></label>
    <dl class="kv"><dt>계정 수</dt><dd id="de-acc"></dd><dt>사업 수</dt><dd id="de-cnt"></dd></dl>
    <div class="zone">
      <h3 class="sec-h" style="margin:0">부서 관리</h3>
      <div id="de-zone" class="row-btns" style="flex-direction:column;align-items:flex-start"></div>
    </div>
  </div>
  <footer><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" id="de-save">저장</button></footer>
</aside>

<!-- 계정 등록 -->
<aside class="drawer" id="p-anew" role="dialog" aria-modal="true" aria-labelledby="p-anew-t">
  <header><h2 id="p-anew-t">계정 등록</h2><button class="x" type="button" data-close aria-label="닫기">×</button></header>
  <form class="dbody" id="f-anew" novalidate>
    <label class="field">부서
      <select id="an-dept" aria-describedby="an-dept-h an-dept-e"></select>
      <span class="hint" id="an-dept-h">부서마다 계정은 하나예요. 계정이 있는 부서는 고를 수 없어요.</span>
      <span class="err" id="an-dept-e" hidden></span></label>
    <label class="field">아이디 <span class="hint">영문 소문자와 숫자 4~16자</span>
      <input id="an-id" autocomplete="off" placeholder="예) cul01" aria-describedby="an-id-e"><span class="err" id="an-id-e" hidden></span></label>
    <div class="field"><label for="an-pw">초기 비밀번호</label>
      <div class="with-btn"><input id="an-pw" autocomplete="off" aria-describedby="an-pw-e an-pw-h"><button class="btn" type="button" id="an-gen">생성</button></div>
      <span class="hint" id="an-pw-h">처음 로그인할 때 직접 바꿔요. 등록한 뒤에는 다시 볼 수 없으니 전달할 곳에 적어 두세요.</span>
      <span class="err" id="an-pw-e" hidden></span></div>
    <label class="field">권한
      <select id="an-role" aria-describedby="an-role-h"><option value="dept">부서관리자</option><option value="admin">총괄</option></select>
      <span class="hint" id="an-role-h">부서관리자는 자기 부서의 사업만 다뤄요.</span></label>
  </form>
  <footer><button class="btn" type="button" data-close>취소</button><button class="btn primary" type="submit" form="f-anew">등록</button></footer>
</aside>

<!-- 계정 수정 -->
<aside class="drawer" id="p-aedit" role="dialog" aria-modal="true" aria-labelledby="p-aedit-t">
  <header><h2 id="p-aedit-t">계정 수정</h2><button class="x" type="button" data-close aria-label="닫기">×</button></header>
  <div class="dbody">
    <div id="ae-status"></div>
    <dl class="kv"><dt>아이디</dt><dd id="ae-id"></dd><dt>부서</dt><dd id="ae-dept"></dd><dt>마지막 로그인</dt><dd id="ae-last"></dd></dl>
    <label class="field">권한
      <select id="ae-role" aria-describedby="ae-role-h"><option value="dept">부서관리자</option><option value="admin">총괄</option></select>
      <span class="hint" id="ae-role-h">권한을 바꾸면 그 계정은 다시 로그인해야 해요</span></label>
    <div class="zone">
      <h3 class="sec-h" style="margin:0">계정 관리</h3>
      <div class="row-btns"><button class="btn" type="button" id="ae-reset">비밀번호 초기화</button></div>
      <div id="ae-zone" class="row-btns" style="flex-direction:column;align-items:flex-start"></div>
    </div>
  </div>
  <footer><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" id="ae-save">저장</button></footer>
</aside>

<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-b">
  <h2 id="dlg-t"></h2><p id="dlg-b"></p>
  <div class="acts"><button class="btn" type="button" id="dlg-cancel" data-close>취소</button><button class="btn danger" type="button" id="dlg-ok"></button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3600)}
const stack=[];
function openLayer(el,focusSel){const sc=el.classList.contains('dlg')?$('#scrim2'):$('#scrim');stack.push({el,sc,from:document.activeElement});sc.classList.add('on');el.classList.add('on');
  setTimeout(()=>{const f=(focusSel&&$(focusSel,el))||el.querySelector('input:not([disabled]),select:not([disabled]),button:not([disabled])');f&&f.focus()},60)}
function closeLayer(el){const i=stack.findIndex(l=>l.el===el);if(i<0)return;const l=stack.splice(i,1)[0];l.el.classList.remove('on');l.sc.classList.remove('on');
  if(l.from&&document.contains(l.from)&&l.from.focus)l.from.focus()}
document.addEventListener('keydown',e=>{
  if(!stack.length)return;const top=stack[stack.length-1].el;
  if(e.key==='Escape'){e.preventDefault();closeLayer(top)}
  if(e.key==='Tab'){const f=$$('input:not([disabled]),select:not([disabled]),button:not([disabled]),[tabindex="0"]',top).filter(x=>x.offsetParent!==null||x===document.activeElement);
    if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
['scrim','scrim2'].forEach(s=>$('#'+s).addEventListener('click',()=>{const l=stack.filter(x=>x.sc.id===s).pop();l&&closeLayer(l.el)}));
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>closeLayer(b.closest('.drawer,.dlg'))));
$$('[data-href]').forEach(b=>b.addEventListener('click',()=>{location.href=b.dataset.href}));
function rowKey(tr,fn){tr.addEventListener('click',fn);tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}
function confirmDlg({title,body,ok,cancel='취소',danger=true,onOk}){const d=$('#dlg');$('#dlg-t').textContent=title;$('#dlg-b').textContent=body;$('#dlg-cancel').textContent=cancel;const b=$('#dlg-ok');b.textContent=ok;b.className='btn '+(danger?'danger':'primary');
  b.onclick=()=>{closeLayer(d);onOk&&onOk()};openLayer(d,'#dlg-cancel')}

/* 가상 데이터 (v = version) */
let depts=[
 {code:'D-101',org:'(가상)시청',name:'정보화담당관',n:4,on:true,v:3},
 {code:'D-102',org:'(가상)시청',name:'기획예산담당관',n:3,on:true,v:1},
 {code:'D-103',org:'(가상)시청',name:'총무과',n:2,on:true,v:2},
 {code:'D-104',org:'(가상)시청',name:'시설관리과',n:5,on:true,v:1},
 {code:'D-105',org:'(가상)시청',name:'복지정책과',n:1,on:true,v:1},
 {code:'D-106',org:'(가상)시청',name:'교통행정과',n:2,on:true,v:4},
 {code:'D-107',org:'(가상)구청',name:'문화관광과',n:0,on:true,v:1},
 {code:'D-108',org:'(가상)구청',name:'환경정책과',n:0,on:true,v:1},
 {code:'D-109',org:'(가상)시청',name:'감사담당관',n:6,on:false,v:5},
 {code:'D-110',org:'(가상)시청',name:'홍보담당관',n:1,on:true,v:1},
];
let accts=[
 {id:'admin01',dept:null,role:'admin',last:'오늘 08:50',on:true,v:2},
 {id:'info01',dept:'D-101',role:'dept',last:'오늘 09:12',on:true,v:1},
 {id:'plan01',dept:'D-102',role:'dept',last:'어제 17:40',on:true,v:1},
 {id:'gen01',dept:'D-103',role:'dept',last:'10-14 11:02',on:true,v:1},
 {id:'fac01',dept:'D-104',role:'dept',last:'오늘 09:05',on:true,v:1},
 {id:'wel01',dept:'D-105',role:'dept',last:'10-12 14:20',on:true,v:1},
 {id:'trf01',dept:'D-106',role:'dept',last:'10-02 15:20',on:true,v:1},
 {id:'aud01',dept:'D-109',role:'dept',last:'09-21 10:11',on:false,v:1},
 {id:'pr01',dept:'D-110',role:'dept',last:'―',on:true,v:1},
];
const dOf=c=>depts.find(d=>d.code===c);
const dLabel=c=>{const d=dOf(c);return d?d.org+' '+d.name:'전체 (부서 없음)'};
const accCount=c=>accts.filter(a=>a.dept===c).length;
const roleBadge=r=>r==='admin'?'<span class="badge primary">총괄</span>':'<span class="badge">부서관리자</span>';
const stBadge=on=>on?'<span class="badge success">✓ 사용</span>':'<span class="badge">― 비활성</span>';
const isLastAdmin=a=>a.role==='admin'&&a.on&&accts.filter(x=>x.role==='admin'&&x.on).length===1;
let conflict=false;
/* 저장 직전 version 확인: 다른 곳에서 먼저 바뀐 경우를 보여 주는 시안 */
function guard(fn,close){
  if(!conflict){fn();return}
  confirmDlg({title:'다른 곳에서 먼저 바뀌었어요',body:'다른 분이 이 내용을 먼저 고쳤어요. 새로 불러온 다음 다시 고쳐 주세요. 지금 적은 내용은 저장되지 않았어요.',ok:'새로 불러오기',cancel:'닫기',danger:false,
    onOk:()=>{conflict=false;$('#d-conf').setAttribute('aria-pressed','false');close&&closeLayer(close);renderAll();toast('최신 내용으로 불러왔어요')}})
}
$('#d-conf').onclick=()=>{conflict=!conflict;$('#d-conf').setAttribute('aria-pressed',conflict)};

/* 탭 */
let tab='dept';
function setTab(t){tab=t;const d=t==='dept';
  $('#t-dept').setAttribute('aria-selected',d);$('#t-acc').setAttribute('aria-selected',!d);$('#t-dept').tabIndex=d?0:-1;$('#t-acc').tabIndex=d?-1:0;
  $('#pn-dept').hidden=!d;$('#pn-acc').hidden=d;
  $('#btn-new').textContent=d?'부서 등록':'계정 등록';
  $('#sub').textContent=d?'시스템을 쓸 부서와 소속을 관리해요':'부서마다 계정 하나를 만들고 권한을 정해요'}
$('#t-dept').onclick=()=>setTab('dept');$('#t-acc').onclick=()=>setTab('acc');
$$('.tab').forEach(t=>t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=t.id==='t-dept'?'acc':'dept';setTab(n);$('#t-'+n).focus()}}));
$('#btn-new').onclick=()=>tab==='dept'?openDNew():openANew();

/* 렌더 */
function renderD(){
  $('#d-count').textContent='전체 '+depts.length+'개 부서';
  $('#d-rows').innerHTML=depts.map((d,i)=>`<tr tabindex="0" data-i="${i}" aria-label="${h(d.org+' '+d.name)} 수정"><td class="tnum">${h(d.code)}</td><td>${h(d.org)}</td><td class="strong">${h(d.name)}</td><td class="num tnum">${accCount(d.code)}</td><td class="num tnum">${d.n}</td><td>${stBadge(d.on)}</td></tr>`).join('');
  $$('#d-rows tr').forEach(tr=>rowKey(tr,()=>openDEdit(+tr.dataset.i)));
}
function renderA(){
  const q=$('#a-q').value.trim().toLowerCase();
  const list=accts.filter(a=>!q||(a.id+' '+dLabel(a.dept)).toLowerCase().includes(q));
  $('#a-count').textContent=q?list.length+'개 찾았어요':'전체 '+accts.length+'개 계정';
  $('#a-none').hidden=list.length>0;
  $('#a-rows').innerHTML=list.map(a=>`<tr tabindex="0" data-id="${h(a.id)}" aria-label="${h(a.id)} 수정"><td class="strong">${h(a.id)}</td><td>${a.dept?h(dLabel(a.dept)):'<span class="muted">전체 (부서 없음)</span>'}</td><td>${roleBadge(a.role)}</td><td class="tnum">${h(a.last)}</td><td>${stBadge(a.on)}</td></tr>`).join('');
  $$('#a-rows tr').forEach(tr=>rowKey(tr,()=>openAEdit(tr.dataset.id)));
}
function renderAll(){renderD();renderA()}
$('#a-q').addEventListener('input',renderA);

/* 검사 */
const show=(id,msg)=>{const e=$('#'+id);e.textContent=msg||'';e.hidden=!msg;const f=e.closest('.field');const inp=f&&f.querySelector('input,select');if(inp){msg?inp.setAttribute('aria-invalid','true'):inp.removeAttribute('aria-invalid')}return !msg};
const need=(v,e,m)=>show(e,v.trim()?'':m);

/* 부서 등록 */
function openDNew(){$('#f-dnew').reset();['dn-code-e','dn-org-e','dn-name-e'].forEach(x=>show(x,''));openLayer($('#p-dnew'),'#dn-code')}
const vCode=v=>{v=v.trim();let m='';if(!v)m='부서 코드를 입력해 주세요';else if(!/^[A-Z0-9-]{3,12}$/.test(v))m='영문 대문자, 숫자, 붙임표로 3~12자로 적어 주세요';else if(depts.some(d=>d.code===v))m='이미 쓰고 있는 코드예요. 다른 코드를 입력해 주세요';return show('dn-code-e',m)};
$('#dn-code').addEventListener('blur',e=>vCode(e.target.value));
$('#f-dnew').addEventListener('submit',e=>{e.preventDefault();
  const a=vCode($('#dn-code').value),b=need($('#dn-org').value,'dn-org-e','소속을 입력해 주세요'),c=need($('#dn-name').value,'dn-name-e','명칭을 입력해 주세요');
  if(!(a&&b&&c)){const f=$$('#f-dnew input').find(i=>i.getAttribute('aria-invalid')==='true');f&&f.focus();return}
  const d={code:$('#dn-code').value.trim(),org:$('#dn-org').value.trim(),name:$('#dn-name').value.trim(),n:0,on:true,v:1};depts.push(d);
  closeLayer($('#p-dnew'));renderAll();toast(d.org+' '+d.name+'을 등록했어요')});

/* 부서 수정 */
let curD=null;
function openDEdit(i){curD=depts[i];const d=curD,k=accCount(d.code),P=$('#p-dedit');
  $('#de-code').value=d.code;$('#de-org').value=d.org;$('#de-name').value=d.name;$('#de-acc').textContent=k+'개';$('#de-cnt').textContent=d.n+'건';show('de-org-e','');show('de-name-e','');
  $('#p-dedit-t').textContent=d.org+' '+d.name;
  $('#de-status').innerHTML=d.on?'<span class="badge success">✓ 사용 중</span>':'<span class="badge">― 비활성 · 이 부서 계정은 로그인할 수 없어요</span>';
  const z=$('#de-zone');
  if(!d.on)z.innerHTML='<button class="btn" type="button" id="z-on">다시 사용하기</button>';
  else if(d.n>0)z.innerHTML='<button class="btn text-danger" type="button" id="z-off">비활성으로 바꾸기</button><button class="btn" type="button" disabled aria-describedby="z-why">삭제</button><p class="why" id="z-why">사업이 있어 삭제 대신 비활성으로 바꿀 수 있어요</p>';
  else z.innerHTML='<button class="btn text-danger" type="button" id="z-del">삭제</button><p class="why">사업이 없어서 삭제할 수 있어요</p>';
  const g=id=>document.getElementById(id);
  g('z-on')&&(g('z-on').onclick=()=>guard(()=>{d.on=true;d.v++;accts.filter(a=>a.dept===d.code).forEach(a=>a.on=true);closeLayer(P);renderAll();toast('다시 사용할 수 있게 바꿨어요')},P));
  g('z-off')&&(g('z-off').onclick=()=>confirmDlg({title:'‘'+d.name+'’을 비활성으로 바꿀까요?',body:'이 부서의 계정은 로그인할 수 없게 돼요. 사업과 기록은 그대로 남아요. 언제든 다시 사용할 수 있어요.',ok:'비활성으로 바꾸기',onOk:()=>guard(()=>{d.on=false;d.v++;accts.filter(a=>a.dept===d.code).forEach(a=>a.on=false);closeLayer(P);renderAll();toast('비활성으로 바꾸고 기록을 남겼어요')},P)}));
  g('z-del')&&(g('z-del').onclick=()=>confirmDlg({title:'‘'+d.name+'’을 삭제할까요?',body:'삭제하면 되돌릴 수 없어요.'+(k?' 이 부서의 계정 '+k+'개도 함께 없어져요.':''),ok:'삭제',onOk:()=>guard(()=>{depts=depts.filter(x=>x!==d);accts=accts.filter(a=>a.dept!==d.code);closeLayer(P);renderAll();toast('삭제하고 기록을 남겼어요')},P)}));
  openLayer(P,'#de-org')}
$('#de-save').onclick=()=>{const a=need($('#de-org').value,'de-org-e','소속을 입력해 주세요'),b=need($('#de-name').value,'de-name-e','명칭을 입력해 주세요');if(!(a&&b))return;
  guard(()=>{curD.org=$('#de-org').value.trim();curD.name=$('#de-name').value.trim();curD.v++;closeLayer($('#p-dedit'));renderAll();toast('저장했어요')},$('#p-dedit'))};

/* 계정 등록 */
function fillDeptSel(){const s=$('#an-dept');
  s.innerHTML='<option value="">부서를 골라 주세요</option>'+depts.filter(d=>d.on).map(d=>{const has=accCount(d.code)>0;return `<option value="${h(d.code)}"${has?' disabled':''}>${h(d.org+' '+d.name)}${has?' · 계정 있음':''}</option>`}).join('')}
const vDept=()=>show('an-dept-e',$('#an-role').value==='admin'||$('#an-dept').value?'':'부서를 골라 주세요');
const vAid=v=>{v=v.trim();let m='';if(!v)m='아이디를 입력해 주세요';else if(!/^[a-z0-9]{4,16}$/.test(v))m='영문 소문자와 숫자로 4~16자로 적어 주세요';else if(accts.some(a=>a.id===v))m='이미 쓰고 있는 아이디예요. 다른 아이디를 입력해 주세요';return show('an-id-e',m)};
const vPw=v=>show('an-pw-e',!v?'초기 비밀번호를 만들어 주세요. [생성]을 누르면 만들어 드려요':(v.length<8?'8자 이상으로 만들어 주세요':''));
$('#an-id').addEventListener('blur',e=>vAid(e.target.value));
$('#an-pw').addEventListener('blur',e=>e.target.value&&vPw(e.target.value));
$('#an-dept').addEventListener('change',vDept);
$('#an-role').addEventListener('change',()=>{const a=$('#an-role').value==='admin';$('#an-dept').disabled=a;if(a){$('#an-dept').value='';show('an-dept-e','')}
  $('#an-role-h').textContent=a?'총괄은 모든 부서와 사업을 다루고, 계정을 만들고 지울 수 있어요.':'부서관리자는 자기 부서의 사업만 다뤄요.'});
const gen=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let p='';for(let i=0;i<10;i++)p+=c[Math.floor(Math.random()*c.length)];return p};
$('#an-gen').onclick=()=>{const p=gen();$('#an-pw').value=p;vPw(p)};
function openANew(){$('#f-anew').reset();fillDeptSel();$('#an-dept').disabled=false;$('#an-role-h').textContent='부서관리자는 자기 부서의 사업만 다뤄요.';['an-dept-e','an-id-e','an-pw-e'].forEach(x=>show(x,''));openLayer($('#p-anew'),'#an-dept')}
$('#f-anew').addEventListener('submit',e=>{e.preventDefault();
  const a=vDept(),b=vAid($('#an-id').value),c=vPw($('#an-pw').value);
  if(!(a&&b&&c)){const f=$$('#f-anew select,#f-anew input').find(i=>i.getAttribute('aria-invalid')==='true');f&&f.focus();return}
  const r=$('#an-role').value,n={id:$('#an-id').value.trim(),dept:r==='admin'?null:$('#an-dept').value,role:r,last:'―',on:true,v:1};accts.push(n);
  closeLayer($('#p-anew'));renderAll();toast(n.id+' 계정을 만들었어요')});

/* 계정 수정 */
let curA=null;
function openAEdit(id){curA=accts.find(a=>a.id===id);const a=curA,last=isLastAdmin(a),P=$('#p-aedit');
  $('#p-aedit-t').textContent=a.id;
  $('#ae-id').textContent=a.id;$('#ae-dept').textContent=dLabel(a.dept);$('#ae-last').textContent=a.last;
  $('#ae-status').innerHTML=a.on?'<span class="badge success">✓ 사용 중</span>':'<span class="badge">― 비활성 · 로그인할 수 없어요</span>';
  const rs=$('#ae-role');rs.value=a.role;rs.disabled=last;
  $('#ae-role-h').textContent=last?'마지막 총괄 계정은 권한을 낮출 수 없어요':'권한을 바꾸면 그 계정은 다시 로그인해야 해요';
  const z=$('#ae-zone');
  if(!a.on)z.innerHTML='<button class="btn" type="button" id="y-on">다시 사용하기</button>';
  else if(last)z.innerHTML='<button class="btn" type="button" disabled aria-describedby="y-why">비활성으로 바꾸기</button><p class="why" id="y-why">마지막 총괄 계정은 비활성할 수 없어요</p>';
  else z.innerHTML='<button class="btn text-danger" type="button" id="y-off">비활성으로 바꾸기</button>';
  const g=x=>document.getElementById(x);
  g('y-on')&&(g('y-on').onclick=()=>guard(()=>{a.on=true;a.v++;closeLayer(P);renderAll();toast('다시 사용할 수 있게 바꿨어요')},P));
  g('y-off')&&(g('y-off').onclick=()=>confirmDlg({title:'‘'+a.id+'’을 비활성으로 바꿀까요?',body:'이 계정은 바로 로그아웃되고 다시 로그인할 수 없어요. 기록은 그대로 남아요.',ok:'비활성으로 바꾸기',onOk:()=>guard(()=>{a.on=false;a.v++;closeLayer(P);renderAll();toast('비활성으로 바꾸고 기록을 남겼어요')},P)}));
  openLayer(P,'#ae-role')}
$('#ae-reset').onclick=()=>confirmDlg({title:'비밀번호를 초기화할까요?',body:'새 임시 비밀번호가 만들어지고, 이 계정은 다음 로그인 때 비밀번호를 새로 정해요.',ok:'초기화',danger:false,onOk:()=>guard(()=>toast('임시 비밀번호를 만들었어요: '+gen()+' (이 화면을 닫으면 다시 볼 수 없어요)'),$('#p-aedit'))});
$('#ae-save').onclick=()=>{const nr=$('#ae-role').value,ch=nr!==curA.role;
  guard(()=>{curA.role=nr;if(nr==='admin')curA.dept=null;curA.v++;closeLayer($('#p-aedit'));renderAll();toast(ch?'저장했어요 · 그 계정은 다시 로그인해야 해요':'저장했어요')},$('#p-aedit'))};

renderAll();setTab(location.hash==='#accounts'?'acc':'dept');
</script>
</body>
</html>
