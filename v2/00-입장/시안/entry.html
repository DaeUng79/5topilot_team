<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심사임당 입장</title>
<!-- 순서 결정: 평가위원 · 사업담당자 · 총괄관리자. 자주 쓰는 순으로 두고, 가끔 쓰는 총괄관리자는 맨 끝에 같은 크기·회색 톤으로 조용히 둠. -->
<style>
:root{
  --primary-5:#ecf2fe;--primary-10:#d8e5fd;--primary-20:#b1cefb;--primary-50:#256ef4;--primary-60:#0b50d0;
  --gray-0:#fff;--gray-5:#f4f5f6;--gray-10:#e6e8ea;--gray-20:#cdd1d5;--gray-30:#b1b8be;--gray-50:#6d7882;--gray-60:#58616a;--gray-70:#464c53;--gray-90:#1e2124;
  --text-1:var(--gray-90);--text-2:var(--gray-70);--text-3:var(--gray-60);
  --radius-sm:10px;--radius-lg:20px;
  --shadow-1:0 1px 3px rgb(3 31 63/.1);--shadow-4:0 10px 24px rgb(3 31 63/.16);
  --ease:cubic-bezier(.2,.9,.2,1);
  --page:var(--gray-0);
  font-family:'Pretendard GOV Variable','Pretendard GOV',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  font-size:17px;line-height:1.5;color:var(--text-1);-webkit-font-smoothing:antialiased;word-break:keep-all;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);min-height:100vh}
body.vb{--page:var(--gray-5)}
:focus-visible{outline:3px solid var(--primary-50);outline-offset:4px;border-radius:var(--radius-sm)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.vt{position:fixed;top:12px;right:16px;display:flex;gap:4px;font-size:16px;z-index:5}
.vt a{color:var(--text-3);text-decoration:none;padding:6px 14px;border-radius:var(--radius-sm);min-height:36px;display:inline-flex;align-items:center}
.vt a[aria-current="true"]{color:var(--primary-60);font-weight:700;background:var(--primary-5)}
.vt a:hover{background:var(--gray-10)}
.mark{position:fixed;top:16px;left:24px;font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--primary-60);margin:0}

main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 24px 64px}
.choices{display:flex;gap:clamp(16px,4vw,72px);justify-content:center;align-items:flex-start;list-style:none;margin:0;padding:0}
.choices li{display:block}
@media (max-width:720px){.choices li{width:100%;display:flex;justify-content:center}}

.pick{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px;width:220px;
  transition:opacity .3s,width .35s var(--ease),padding .35s}
.ico{width:128px;height:128px;display:grid;place-items:center;transition:transform .25s var(--ease),box-shadow .25s}
.ico svg{width:128px;height:128px;display:block}
.name{font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--text-1)}
.hint{font-size:17px;color:var(--text-3);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s var(--ease);min-height:26px;margin-top:-8px}
.pick:hover .ico,.pick:focus-visible .ico{transform:translateY(-8px) scale(1.04)}
.pick:hover .hint,.pick:focus-visible .hint{opacity:1;transform:none}
.pick:active .ico{transform:scale(.96)}
.pick:focus-visible{outline-offset:2px}

.ic-fill{fill:var(--primary-5)} .ic-line{stroke:var(--primary-50)}
.pick.admin .ic-fill{fill:var(--gray-10)} .pick.admin .ic-line{stroke:var(--gray-50)}
.pick.admin .name{color:var(--text-2)}
svg *{stroke-linecap:round;stroke-linejoin:round}

.vb .ico{width:148px;height:148px;border-radius:36px;background:var(--gray-0);box-shadow:var(--shadow-1)}
.vb .ico svg{width:96px;height:96px}
.vb .pick:hover .ico,.vb .pick:focus-visible .ico{box-shadow:var(--shadow-4)}
.vb .ic-fill{fill:var(--primary-10)} .vb .pick.admin .ic-fill{fill:var(--gray-10)}

.login{width:100%;max-width:400px;overflow:hidden;max-height:0;opacity:0;transform:translateY(24px);visibility:hidden;
  transition:max-height .45s var(--ease),opacity .35s,transform .45s var(--ease),margin .45s}
.picked .login{max-height:560px;opacity:1;transform:none;visibility:visible;margin-top:24px}
.picked .pick:not(.on){display:none}
.picked .choices{gap:0}
.picked .pick.on{cursor:default}
.picked .pick.on .ico{transform:none;width:88px;height:88px}
.picked .pick.on .ico svg{width:88px;height:88px}
.picked.vb .pick.on .ico{width:104px;height:104px;border-radius:28px}
.picked.vb .pick.on .ico svg{width:64px;height:64px}
.picked .pick.on .hint{display:none}
.picked .pick.on .name{font-size:24px}
.picked main{justify-content:flex-start;padding-top:11vh}
.back{appearance:none;background:none;border:0;color:var(--text-3);font-size:17px;min-height:44px;padding:0 12px;cursor:pointer;border-radius:var(--radius-sm);margin:0 auto 8px;display:flex;align-items:center}
.back:hover{background:var(--gray-10);color:var(--text-1)}
form{display:flex;flex-direction:column;gap:20px}
label{display:flex;flex-direction:column;gap:8px;font-size:18px;font-weight:700}
input{font-size:18px;font-weight:400;height:56px;border:1px solid var(--gray-50);border-radius:var(--radius-sm);padding:0 16px;background:var(--gray-0);width:100%}
input:focus{outline:3px solid var(--primary-20);border-color:var(--primary-50)}
.go{appearance:none;border:0;height:56px;border-radius:var(--radius-sm);background:var(--primary-50);color:#fff;font-size:18px;font-weight:700;cursor:pointer;margin-top:4px;transition:background .15s,transform .12s var(--ease)}
.go:hover{background:var(--primary-60)} .go:active{transform:scale(.98)}
.msg{min-height:28px;font-size:17px;text-align:center;color:var(--text-2);margin:0}
.msg.show::before{content:"ⓘ "}

@media (max-width:720px){
  main{padding:72px 16px 40px}
  .choices{flex-direction:column;gap:4px;align-items:center}
  .pick{display:grid;grid-template-columns:auto 1fr;column-gap:20px;row-gap:0;width:300px;max-width:100%;padding:8px 12px;text-align:left;align-items:center;justify-items:start}
  .pick .ico{grid-row:1/3}
  .ico,.ico svg{width:80px;height:80px}
  .vb .ico{width:88px;height:88px;border-radius:24px}.vb .ico svg{width:56px;height:56px}
  .hint{opacity:1;transform:none;margin:0;min-height:0;font-size:16px}
  .mark{left:16px}
  .picked .pick.on{display:flex}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<p class="mark">심사임당</p>
<nav class="vt" aria-label="시안 전환"><a href="?v=a" id="va">A</a><a href="?v=b" id="vb">B</a></nav>

<main id="stage">
  <h1 class="sr-only">어떤 일로 오셨나요?</h1>
  <ul class="choices" role="list">
    <li><button class="pick" data-role="eval" type="button">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 96 96" fill="none" stroke-width="4">
        <rect class="ic-fill ic-line" x="22" y="16" width="52" height="68" rx="10"/>
        <rect class="ic-line" x="36" y="9" width="24" height="14" rx="6" style="fill:#fff"/>
        <path class="ic-line" d="M34 52l9 9 19-20"/>
        <path class="ic-line" d="M34 72h28" opacity=".5"/></svg></span>
      <span class="name">평가위원</span><span class="hint">문서 열람·평가</span></button></li>
    <li><button class="pick" data-role="biz" type="button">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 96 96" fill="none" stroke-width="4">
        <path class="ic-fill ic-line" d="M10 30a8 8 0 018-8h18l8 9h34a8 8 0 018 8v37a8 8 0 01-8 8H18a8 8 0 01-8-8z"/>
        <path class="ic-line" d="M48 46v22M37 57h22"/></svg></span>
      <span class="name">사업담당자</span><span class="hint">사업 등록·위원 선정</span></button></li>
    <li><button class="pick admin" data-role="admin" type="button">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 96 96" fill="none" stroke-width="4">
        <path class="ic-fill ic-line" d="M48 10l30 11v22c0 20-13 36-30 43-17-7-30-23-30-43V21z"/>
        <circle class="ic-line" cx="48" cy="46" r="9" style="fill:#fff"/>
        <path class="ic-line" d="M48 30v7M48 55v7M32 46h7M57 46h7" opacity=".6"/></svg></span>
      <span class="name">총괄관리자</span><span class="hint">시스템 운영</span></button></li>
  </ul>

  <div class="login" id="login">
    <button class="back" type="button" id="back">‹ 다른 입장 선택</button>
    <form id="f" novalidate>
      <label><span class="lt">아이디</span><input autocomplete="off"></label>
      <label><span class="lt">비밀번호</span><input type="password" autocomplete="off"></label>
      <button class="go" type="submit">로그인</button>
      <p class="msg" id="msg" role="status"></p>
    </form>
  </div>
</main>

<script>
(function(){
  var q=new URLSearchParams(location.search).get('v');
  var v=(q==='b')?'b':'a';
  document.body.classList.add('v'+v);
  document.getElementById('v'+v).setAttribute('aria-current','true');
  var body=document.body,msg=document.getElementById('msg'),f=document.getElementById('f');
  var picks=document.querySelectorAll('.pick'),cur=null;
  function setForm(role){
    var t=role==='eval'?[['이름','text'],['전화번호','tel']]:[['아이디','text'],['비밀번호','password']];
    f.querySelectorAll('label').forEach(function(l,i){
      l.querySelector('.lt').textContent=t[i][0];
      var inp=l.querySelector('input');inp.type=t[i][1];inp.value='';
      if(t[i][1]==='tel'){inp.setAttribute('inputmode','numeric');inp.placeholder='010-0000-0000'}
      else{inp.removeAttribute('inputmode');inp.placeholder=''}
    });
    msg.textContent='';msg.classList.remove('show');
  }
  function choose(btn){
    cur=btn;setForm(btn.dataset.role);
    picks.forEach(function(p){p.classList.toggle('on',p===btn)});
    body.classList.add('picked');
    setTimeout(function(){f.querySelector('input').focus()},150);
  }
  function back(){
    body.classList.remove('picked');
    picks.forEach(function(p){p.classList.remove('on')});
    if(cur)cur.focus();
  }
  picks.forEach(function(p){p.addEventListener('click',function(){if(!body.classList.contains('picked'))choose(p)})});
  document.getElementById('back').addEventListener('click',back);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&body.classList.contains('picked'))back()});
  f.addEventListener('submit',function(e){
    e.preventDefault();msg.textContent='시안입니다 · 실제 로그인은 연결되지 않아요';msg.classList.add('show');
  });
})();
</script>
</body>
</html>
