 [15,'(가상)누리연구원','빅데이터팀','양지안','선임연구원',2,'jian.yang@example.com','010-0000-3015',3],

const XLS=[
 ['(가상)한빛대학교','컴퓨터공학과','권도현','교수','시스템 구축','dohyun.kwon@example.com','010-0000-3101'],
 ['(가상)누리연구원','AI연구실','서하린','책임연구원','데이터·AI','harin.seo@example.com','010-0000-3102'],
 ['(가상)한빛대학교','컴퓨터공학과','한도윤','교수','시스템 구축','doyun.han@example.com','010-0000-3001'],
 ['(가상)새솔대학교','경영학과','문지후','교수','사업관리','jihu.moon.example.com','010-0000-3104'],
 ['(가상)푸른대학교','소프트웨어학과','배서윤','부교수','정보보안','seoyun.bae@example.com',''],
 ['(가상)다온연구원','보안연구실','류시우','선임연구원','정보보안','siwoo.ryu@example.com','010-0000-3106']
];
function checkRow(r,have){
  if(!r[2]||!r[0])return {k:'err',m:'기관·이름이 비었어요'};
  if(!FIELDS.includes(r[4]))return {k:'err',m:'분야를 확인해 주세요'};
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r[5]))return {k:'err',m:'이메일 형식이 아니에요'};
  if(!/^010-\d{4}-\d{4}$/.test(r[6]))return {k:'err',m:'전화번호가 없거나 형식이 달라요'};
  if(have(r[5]))return {k:'dup',m:'이미 있는 사람이에요'};
  return {k:'ok',m:'넣을 수 있어요'}}
function downloadTemplate(){const head=['기관','부서','이름','직책','분야('+FIELDS.join('/')+')','이메일','전화(010-0000-0000)'];
  const csv='﻿'+head.join(',')+'\n'+XLS[0].join(',')+'\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='위원_올리기_양식.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('양식을 내려받았어요')}
/* 엑셀 올리기: box 안에 그리고, 정상 행만 onAdd로 넘긴다 */
function excelBox(box,have,onAdd,primary=true){
  box.innerHTML=`<div class="xl-top"><button class="btn" type="button" data-xl="tpl">양식 내려받기</button><label class="btn" tabindex="0" data-xl="pick">파일 고르기<input type="file" class="sr-only" accept=".xlsx,.xls,.csv" tabindex="-1"></label><button class="btn" type="button" data-xl="demo">예시 파일로 미리보기</button></div>
  <div class="xl-prev"></div>`;
  const prev=$('.xl-prev',box);
  function show(name){const R=XLS.map(r=>({r,c:checkRow(r,have)}));const ok=R.filter(x=>x.c.k==='ok'),er=R.filter(x=>x.c.k==='err').length,du=R.filter(x=>x.c.k==='dup').length;
    prev.innerHTML=`<div class="xl-sum"><b>${h(name)}</b><span class="badge success">✓ 정상 ${ok.length}</span><span class="badge danger">! 오류 ${er}</span><span class="badge warning">= 중복 ${du}</span></div>
    <div class="xl-tbl"><table><thead><tr><th>줄</th><th>이름</th><th>분야</th><th>전화</th><th>확인 결과</th></tr></thead><tbody>${R.map((x,i)=>`<tr class="r-${x.c.k}"><td class="tnum">${i+2}</td><td class="strong">${h(x.r[2]||'(빈칸)')}</td><td>${h(x.r[4])}</td><td class="tnum">${h(x.r[6]||'(빈칸)')}</td><td><span class="badge ${x.c.k==='ok'?'success':x.c.k==='dup'?'warning':'danger'}">${x.c.k==='ok'?'✓ 정상':x.c.k==='dup'?'= 중복':'! 오류'}</span> <span class="muted">${x.c.k==='ok'?'':x.c.m}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="xl-act"><span class="muted">오류·중복 줄은 빼고 정상인 ${ok.length}명만 넣어요.</span><button class="btn${primary?' primary':''}" type="button" id="xl-go" ${ok.length?'':'disabled'}>정상 ${ok.length}명 넣기</button></div>`;
    $('#xl-go',prev).onclick=()=>{onAdd(ok.map(x=>x.r));prev.innerHTML='<div class="note" style="margin-top:16px"><span>✓</span><span>'+ok.length+'명을 넣었어요. 오류·중복 '+(er+du)+'줄은 넣지 않았어요.</span></div>'}}
  $('[data-xl=tpl]',box).onclick=downloadTemplate;
  $('[data-xl=demo]',box).onclick=()=>show('예시_위원목록.xlsx');
  const inp=$('input[type=file]',box);inp.onchange=()=>{if(inp.files[0])show(inp.files[0].name)};
  $('[data-xl=pick]',box).addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}});
  return {show}}

let P=POOL.map(p=>({...p}));let ff='',q='',nid=200;
$('#f-field').innerHTML=['전체',...FIELDS].map((f,i)=>`<button class="chip" type="button" data-f="${i?f:''}" aria-pressed="${i===0}">${f}</button>`).join('');
$$('#f-field .chip').forEach(c=>c.onclick=()=>{ff=c.dataset.f;$$('#f-field .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render()});
$('#q').oninput=e=>{q=e.target.value.trim();render()};
const list=()=>P.filter(r=>(!ff||r.field===ff)&&(!q||r.name.includes(q)||r.org.includes(q)));
function render(){const L=list();$('#count').textContent=L.length+'명';$('#none').hidden=L.length>0;$('table').hidden=!L.length;
  $('#rows').innerHTML=L.map(r=>`<tr tabindex="0" data-id="${r.id}" aria-label="${h(r.name)} 자세히 보기"><td>${h(r.org.replace('(가상)',''))}</td><td>${h(r.dept)}</td><td class="strong">${h(r.name)}</td><td>${h(r.pos)}</td><td>${h(r.field)}</td><td class="em">${h(r.email)}</td><td class="tnum">${r.tel}</td><td class="num tnum">${r.n}회</td></tr>`).join('');
  $$('#rows tr').forEach(tr=>rowKey(tr,()=>openDetail(+tr.dataset.id)))}
function footBtns(html){$('#p-foot').innerHTML=html}
function openDetail(id){const r=P.find(x=>x.id===id);$('#p-t').textContent=r.name;
  $('#p-body').innerHTML=`<dl class="kv"><dt>기관</dt><dd>${h(r.org)}</dd><dt>부서</dt><dd>${h(r.dept)}</dd><dt>직책</dt><dd>${h(r.pos)}</dd><dt>분야</dt><dd>${h(r.field)}</dd><dt>이메일</dt><dd>${h(r.email)}</dd><dt>전화</dt><dd class="tnum">${r.tel}</dd><dt>참여 횟수</dt><dd>${r.n}회</dd></dl>
  <div class="note"><span>i</span><span>이름을 고치거나 지워도 이미 확정된 사업의 명단은 바뀌지 않아요.</span></div>`;
  footBtns('<button class="btn text-danger" type="button" id="b-del" style="margin-right:auto">삭제</button><button class="btn primary" type="button" id="b-edit">수정</button>');
  $('#b-edit').onclick=()=>form(r);
  $('#b-del').onclick=()=>confirmDlg({title:'‘'+r.name+'’ 위원을 풀에서 뺄까요?',body:'풀에서만 빠지고, 이미 확정된 사업의 명단에는 영향이 없어요.',ok:'빼기',danger:true,onOk:()=>{P=P.filter(x=>x!==r);closeLayer($('#p'));render();toast('풀에서 뺐어요')}});
  openLayer($('#p'),'.x')}
function form(r){const e=!!r;$('#p-t').textContent=e?'위원 수정':'위원 추가';const v=r||{org:'',dept:'',name:'',pos:'',field:FIELDS[0],email:'',tel:''};
  const f=(k,l,ph,t='text')=>`<label class="field">${l}<input id="f-${k}" type="${t}" placeholder="${ph}" value="${h(v[k])}"></label>`;
  $('#p-body').innerHTML=`<div class="fgrid2">${f('org','기관','(가상)한빛대학교')}${f('dept','부서','컴퓨터공학과')}${f('name','이름','홍길동')}${f('pos','직책','교수')}
  <label class="field">분야<select id="f-field">${FIELDS.map(x=>`<option ${x===v.field?'selected':''}>${x}</option>`).join('')}</select></label>${f('email','이메일','name@example.com','email')}${f('tel','전화','010-0000-0000','tel')}</div><div id="ferr"></div>`;
  footBtns('<button class="btn" type="button" id="b-cancel">취소</button><button class="btn primary" type="button" id="b-save">'+(e?'저장':'추가')+'</button>');
  $('#b-cancel').onclick=()=>e?openDetail(r.id):closeLayer($('#p'));
  $('#b-save').onclick=()=>{const g=k=>$('#f-'+k).value.trim();let m='';
    if(!g('org')||!g('name'))m='기관과 이름을 적어 주세요';else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g('email')))m='이메일 형식으로 적어 주세요';else if(!/^010-\d{4}-\d{4}$/.test(g('tel')))m='전화는 010-0000-0000 형식으로 적어 주세요';else if(P.some(x=>x.email===g('email')&&x!==r))m='이미 풀에 있는 이메일이에요';
    if(m){$('#ferr').innerHTML='<p class="err" role="alert">'+m+'</p>';return}
    const d={org:g('org'),dept:g('dept'),name:g('name'),pos:g('pos'),field:$('#f-field').value,email:g('email'),tel:g('tel')};
    if(e){Object.assign(r,d);toast('고쳤어요');render();openDetail(r.id)}else{P.unshift({id:nid++,n:0,...d});toast('풀에 추가했어요');render();closeLayer($('#p'))}};
  if(!stack.some(l=>l.el===$('#p')))openLayer($('#p'),'#f-org');else setTimeout(()=>$('#f-org').focus(),60)}
