<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사업 정보 · 심사임당 사업담당자</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../총괄관리자/_shell.css">
<link rel="stylesheet" href="../../_steps.css">
<style>
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.panel{padding:24px 28px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.panel .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel h2{font-size:var(--t-xl)}
.sum{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sum li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.sum li:last-child{border:0}
.sum .k{font-size:var(--t-base);color:var(--text-3)}
.sum .v{font-size:var(--t-xl);font-weight:700}
.sum .st{grid-row:1 / span 2;grid-column:2;align-self:center}
.bar{height:8px;border-radius:var(--radius-full);background:var(--gray-10);overflow:hidden;grid-column:1 / -1;margin-top:6px}
.bar i{display:block;height:100%;background:var(--primary-50);border-radius:var(--radius-full)}
.sync{grid-column:1 / -1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--warning-5);border:1px solid var(--warning-10);font-size:var(--t-base)}
.sync .btn{min-height:36px;padding:0 12px;font-size:var(--t-base);margin-left:auto}
.form{display:flex;flex-direction:column;gap:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <button class="brand" type="button" data-href="../../PM-01-사업-목록-등록/시안/projects.html" aria-label="심사임당 사업 목록으로"><span class="brand-mark">심</span><span>심사임당</span></button>
  <p class="role">(가상) 정보화담당관</p>
  <nav aria-label="주 메뉴">
    <a href="../../PM-01-사업-목록-등록/시안/projects.html" aria-current="page">사업 목록</a>
    <a href="../../PM-07-위원-풀/시안/pool.html">위원 풀</a>
  </nav>
  <div class="bottom">
    <a href="#" data-account>내 계정</a>
    <a href="../../PM-00-로그인/시안/login.html">로그아웃</a>
  </div>
</aside>
<div class="main">
  <header class="pj-head">
    <a class="pj-back" href="projects.html">← 사업 목록</a>
    <div class="pj-row">
      <div class="pj-title"><h1 id="t-name"></h1><span class="badge info" id="t-st">○ 준비</span></div>
      <div class="pj-act"><span class="hint">다음 일: 문서 올리기</span><a class="btn primary" href="../../PM-02-문서-목차/시안/documents.html">다음: 문서</a></div>
    </div>
  </header>
  <nav class="steps" id="steps" aria-label="진행 단계"></nav>
  <div class="body">
    <div class="cols">
      <section class="card panel" aria-label="사업 정보">
        <div class="top"><h2>사업 정보</h2><button class="btn" type="button" id="b-edit">수정</button></div>
        <dl class="kv" id="info"></dl>
      </section>
      <section class="card panel" aria-label="한눈에 보기">
        <div class="top"><h2>한눈에 보기</h2></div>
        <ul class="sum">
          <li><span class="k">문서 준비</span><span class="v tnum" id="docs">3 / 5</span><span class="st badge warning" id="docs-b">◐ 진행 중</span>
            <div class="bar" aria-hidden="true"><i id="docs-bar" style="width:60%"></i></div>
            <div class="sync" id="sync" role="status"><span class="badge warning">⟳ 아직 반영 안 됨</span><span>방금 올린 제안서 1건이 아직 이 화면에 안 넘어왔어요.</span><button class="btn" type="button" id="b-sync">새로 고침</button></div></li>
          <li><span class="k">평가위원 확정</span><span class="v">아직 안 했어요</span><span class="st badge">○ 대기</span></li>
          <li><span class="k">결과</span><span class="v">아직 없어요</span><span class="st badge">○ 대기</span></li>
        </ul>
      </section>
    </div>
  </div>
  <div class="demo" id="demo"><b>시안 보기</b>
    <button type="button" data-st="stale" aria-pressed="true">반영 안 됨 있음</button>
    <button type="button" data-st="fresh" aria-pressed="false">모두 반영됨</button>
    <span class="muted" style="margin-left:auto">‘아직 반영 안 됨’은 다른 데이터베이스에서 값이 늦게 올 때 보여요</span></div>
</div>
</div>

<div class="scrim" id="scrim"></div><div class="scrim top" id="scrim2"></div>
<aside class="drawer" id="p" role="dialog" aria-modal="true" aria-labelledby="p-t">
  <header><h2 id="p-t">사업 정보 수정</h2><button class="x" type="button" data-close aria-label="닫기">×</button></header>
  <form class="dbody form" id="f-edit" novalidate>
    <label class="field">사업명<input id="e-name" aria-describedby="e-name-e"><span class="err" id="e-name-e" hidden></span></label>
    <div class="two">
      <label class="field">담당자 이름<input id="e-owner"></label>
      <label class="field">직급<input id="e-pos"></label>
    </div>
    <label class="field">소속<input id="e-org"></label>
    <label class="field">전화<input id="e-tel" type="tel"></label>
    <label class="field"><span>이메일 <span class="hint">(선택)</span></span><input id="e-mail" type="email"></label>
    <label class="field">평가일<input id="e-date" type="date"></label>
  </form>
  <footer><button class="btn" type="button" data-close>취소</button><button class="btn primary" type="submit" form="f-edit">저장</button></footer>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../../_ui.js"></script>
<script>
const ALL={
 1:{name:'(가상) 통합 민원 시스템 구축 용역',owner:'김가상',pos:'주무관',tel:'010-0000-2101',mail:'kim.gasang@gov.test',date:'2026-11-05'},
 3:{name:'(가상) 시민 앱 고도화 용역',owner:'박다상',pos:'팀장',tel:'010-0000-2103',mail:'',date:'2026-10-20'},
};
const id=+(new URLSearchParams(location.search).get('id')||1);
const D=Object.assign({org:'(가상) 정보화담당관'},ALL[id]||{name:'(가상) 사업',owner:'이나상',pos:'주무관',tel:'010-0000-2199',mail:'',date:''});
function paint(){
  document.title=D.name+' · 사업 정보';$('#t-name').textContent=D.name;
  $('#info').innerHTML=[['사업명',D.name],['담당자',D.owner+' · '+D.pos],['소속',D.org],['전화',`<span class="tnum">${h(D.tel)}</span>`],['이메일',D.mail?h(D.mail):'<span class="muted" style="font-weight:400">없음</span>'],['평가일',D.date?`<span class="tnum">${D.date}</span>`:'<span class="muted" style="font-weight:400">아직 안 정함</span>']]
   .map(([k,v])=>`<dt>${k}</dt><dd>${k==='사업명'||k==='담당자'||k==='소속'?h(v):v}</dd>`).join('')}
paint();
renderSteps($('#steps'),['current','open','locked','locked','locked','locked']);
$('#b-edit').onclick=()=>{const m={name:'e-name',owner:'e-owner',pos:'e-pos',org:'e-org',tel:'e-tel',mail:'e-mail',date:'e-date'};for(const k in m)$('#'+m[k]).value=D[k]||'';$('#e-name-e').hidden=true;$('#e-name').removeAttribute('aria-invalid');openLayer($('#p'),'#e-name')};
$('#f-edit').addEventListener('submit',e=>{e.preventDefault();const n=$('#e-name').value.trim();
  if(!n){$('#e-name-e').textContent='사업명을 적어 주세요';$('#e-name-e').hidden=false;$('#e-name').setAttribute('aria-invalid','true');$('#e-name').focus();return}
  Object.assign(D,{name:n,owner:$('#e-owner').value.trim()||D.owner,pos:$('#e-pos').value.trim()||D.pos,org:$('#e-org').value.trim()||D.org,tel:$('#e-tel').value.trim()||D.tel,mail:$('#e-mail').value.trim(),date:$('#e-date').value});
  paint();closeLayer($('#p'));toast('저장했어요')});
function setSync(stale){$('#sync').hidden=!stale;$('#docs').textContent=stale?'3 / 5':'4 / 5';$('#docs-bar').style.width=stale?'60%':'80%';
  $$('#demo [data-st]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.st===(stale?'stale':'fresh')))}
$$('#demo [data-st]').forEach(b=>b.onclick=()=>setSync(b.dataset.st==='stale'));
$('#b-sync').onclick=()=>{setSync(false);toast('최신 값으로 바꿨어요')};
</script>
</body>
</html>
