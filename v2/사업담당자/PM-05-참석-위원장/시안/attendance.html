const XLS=[
 ['(가상)한빛대학교','컴퓨터공학과','권도현','교수','시스템 구축','dohyun.kwon@example.com','010-0000-3101'],
 ['(가상)누리연구원','AI연구실','서하린','책임연구원','데이터·AI','harin.seo@example.com','010-0000-3102'],
 ['(가상)한빛대학교','컴퓨터공학과','한도윤','교수','시스템 구축','doyun.han@example.com','010-0000-3001'],
 ['(가상)새솔대학교','경영학과','문지후','교수','사업관리','jihu.moon.example.com','010-0000-3104'],
 ['(가상)푸른대학교','소프트웨어학과','배서윤','부교수','정보보안','seoyun.bae@example.com',''],
 ['(가상)다온연구원','보안연구실','류시우','선임연구원','정보보안','siwoo.ryu@example.com','010-0000-3106']
];
function checkRow(r,have){
  if(!r[2]||!r[0])return {k:'err',m:'기관·이름이 비었어요'};
  if(!FIELDS.includes(r[4]))return {k:'err',m:'분야를 확인해 주세요'};
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r[5]))return {k:'err',m:'이메일 형식이 아니에요'};
  if(!/^010-\d{4}-\d{4}$/.test(r[6]))return {k:'err',m:'전화번호가 없거나 형식이 달라요'};
  if(have(r[5]))return {k:'dup',m:'이미 있는 사람이에요'};
  return {k:'ok',m:'넣을 수 있어요'}}
function downloadTemplate(){const head=['기관','부서','이름','직책','분야('+FIELDS.join('/')+')','이메일','전화(010-0000-0000)'];
  const csv='﻿'+head.join(',')+'\n'+XLS[0].join(',')+'\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='위원_올리기_양식.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('양식을 내려받았어요')}
/* 엑셀 올리기: box 안에 그리고, 정상 행만 onAdd로 넘긴다 */
function excelBox(box,have,onAdd,primary=true){
  box.innerHTML=`<div class="xl-top"><button class="btn" type="button" data-xl="tpl">양식 내려받기</button><label class="btn" tabindex="0" data-xl="pick">파일 고르기<input type="file" class="sr-only" accept=".xlsx,.xls,.csv" tabindex="-1"></label><button class="btn" type="button" data-xl="demo">예시 파일로 미리보기</button></div>
  <div class="xl-prev"></div>`;
  const prev=$('.xl-prev',box);
  function show(name){const R=XLS.map(r=>({r,c:checkRow(r,have)}));const ok=R.filter(x=>x.c.k==='ok'),er=R.filter(x=>x.c.k==='err').length,du=R.filter(x=>x.c.k==='dup').length;
    prev.innerHTML=`<div class="xl-sum"><b>${h(name)}</b><span class="badge success">✓ 정상 ${ok.length}</span><span class="badge danger">! 오류 ${er}</span><span class="badge warning">= 중복 ${du}</span></div>
    <div class="xl-tbl"><table><thead><tr><th>줄</th><th>이름</th><th>분야</th><th>전화</th><th>확인 결과</th></tr></thead><tbody>${R.map((x,i)=>`<tr class="r-${x.c.k}"><td class="tnum">${i+2}</td><td class="strong">${h(x.r[2]||'(빈칸)')}</td><td>${h(x.r[4])}</td><td class="tnum">${h(x.r[6]||'(빈칸)')}</td><td><span class="badge ${x.c.k==='ok'?'success':x.c.k==='dup'?'warning':'danger'}">${x.c.k==='ok'?'✓ 정상':x.c.k==='dup'?'= 중복':'! 오류'}</span> <span class="muted">${x.c.k==='ok'?'':x.c.m}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="xl-act"><span class="muted">오류·중복 줄은 빼고 정상인 ${ok.length}명만 넣어요.</span><button class="btn${primary?' primary':''}" type="button" id="xl-go" ${ok.length?'':'disabled'}>정상 ${ok.length}명 넣기</button></div>`;
    $('#xl-go',prev).onclick=()=>{onAdd(ok.map(x=>x.r));prev.innerHTML='<div class="note" style="margin-top:16px"><span>✓</span><span>'+ok.length+'명을 넣었어요. 오류·중복 '+(er+du)+'줄은 넣지 않았어요.</span></div>'}}
  $('[data-xl=tpl]',box).onclick=downloadTemplate;
  $('[data-xl=demo]',box).onclick=()=>show('예시_위원목록.xlsx');
  const inp=$('input[type=file]',box);inp.onchange=()=>{if(inp.files[0])show(inp.files[0].name)};
  $('[data-xl=pick]',box).addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}});
  return {show}}

const MIN=5;
/* 이름, 구분, 참석 응답(참석/불참/응답 전), 동의 */
const NAMES=[['한도윤','본'],['이서연','본'],['박지호','본'],['정민재','본'],['강예린','본'],['신주원','본'],['양지안','본'],['최유나','예비'],['조은서','예비']];
const SC={
  ok:[['참석',1],['참석',1],['참석',1],['참석',0],['참석',1],['불참',0],['응답 전',0],['참석',1],['응답 전',0]],
  few:[['참석',1],['참석',1],['응답 전',0],['응답 전',0],['참석',1],['불참',0],['응답 전',0],['응답 전',0],['응답 전',0]]};
let scn='ok',started=false,chair=null,pick=null;
const M=()=>NAMES.map((n,i)=>({id:i,name:n[0],kind:n[1],ans:SC[scn][i][0],agree:SC[scn][i][1]}));
const confirmed=m=>m.ans==='참석'&&m.agree;
function checks(){const c=M().filter(confirmed).length;
  return [{ok:c>=MIN,t:'최소 인원',s:`참석 확정 ${c}명 (최소 ${MIN}명)`},{ok:true,t:'평가표 확정',s:'평가항목 5개 · 합계 100점'},{ok:true,t:'업체 문서 준비',s:'업체 3곳 · 문서 3/3'}]}
function render(){
  const L=M(),C=checks(),ok=C.every(x=>x.ok);
  renderSteps($('#steps'),['done','done','done','done','current','locked']);
  $('#pst').className='badge '+(started?'primary':'info');$('#pst').textContent=started?'● 평가 중':'○ 준비';
  $('#cbar').innerHTML=started
   ?`<div class="lockbar"><span role="img" aria-label="잠김">🔒</span> 평가를 시작했어요 · 참여자·업체·기준이 잠겼어요</div>`
   :`<ul class="chk" aria-label="평가 시작 전 점검">${C.map(x=>`<li class="${x.ok?'okc':'badc'}"><span class="ic" aria-hidden="true">${x.ok?'✓':'!'}</span><span><b>${x.t}</b><small>${x.ok?'':'모자라요 · '}${x.s}</small></span></li>`).join('')}</ul>
   <div class="go"><button class="btn primary lg" type="button" id="start" ${ok?'':'disabled'}>평가 시작</button>${ok?'':'<span class="err">점검에서 막혔어요</span>'}</div>`;
  const a=L.filter(m=>m.ans==='참석').length,b=L.filter(m=>m.ans==='불참').length,c=L.filter(m=>m.ans==='응답 전').length;
  $('#tb').innerHTML=`<strong>위원 ${L.length}명</strong><span class="badge success">✓ 참석 ${a}</span><span class="badge danger">× 불참 ${b}</span><span class="badge">… 응답 전 ${c}</span><span class="count">위원이 직접 응답해요. 여기서는 볼 수만 있어요.</span>`;
  $('#th').innerHTML=`<tr>${started?'<th style="width:72px">위원장</th>':''}<th>이름</th><th>구분</th><th>참석 상태</th><th>동의 여부</th></tr>`;
  $('#rows').innerHTML=L.map(m=>{const can=confirmed(m);const isCh=chair===m.id;
   return `<tr class="${isCh?'chair':''}">${started?`<td>${chair==null?`<input class="rd" type="radio" name="chair" value="${m.id}" aria-label="${m.name} 위원장으로 고르기" ${can?'':'disabled'} ${pick===m.id?'checked':''}>`:isCh?'<span class="badge primary">★ 위원장</span>':''}</td>`:''}
   <td class="strong">${m.name}</td><td><span class="badge ${m.kind==='본'?'info':''}">${m.kind==='본'?'본위원':'예비'}</span></td>
   <td><span class="badge ${m.ans==='참석'?'success':m.ans==='불참'?'danger':''}">${m.ans==='참석'?'✓ 참석':m.ans==='불참'?'× 불참':'… 응답 전'}</span></td>
   <td>${m.ans==='불참'?'<span class="muted">—</span>':m.agree?'<span class="badge success">✓ 동의함</span>':'<span class="badge warning">아직 안 함</span>'}${started&&m.ans==='참석'&&!can&&chair==null?' <span class="muted">동의 뒤에 고를 수 있어요</span>':''}${started&&!can&&m.ans!=='참석'&&chair==null?' <span class="muted">참석 확정이 아니에요</span>':''}</td></tr>`}).join('');
  const f=$('#foot');
  if(started){f.hidden=false;
    f.innerHTML=chair==null?`<span class="why">참석을 확정한 위원 중 한 명을 위원장으로 지정해 주세요.</span><button class="btn primary" type="button" id="setchair" ${pick==null?'disabled':''}>지정</button>`
      :`<span class="why">위원장 <b>${L[chair].name}</b> 위원이 지정됐어요. 위원장이 평가를 확인하면 결과가 열려요.</span><a class="btn" href="../../PM-06-평가-결과/시안/results.html">결과 화면 보기</a>`}
  else f.hidden=true;
  $('#start')&&($('#start').onclick=()=>confirmDlg({title:'평가를 시작할까요?',body:'시작하면 참여자·업체·기준이 잠겨요. 되돌릴 수 없어요.',ok:'시작하기',onOk:()=>{started=true;render();toast('평가를 시작했어요')}}));
  $$('input[name=chair]').forEach(r=>r.onchange=()=>{pick=+r.value;render();document.querySelector(`input[name=chair][value="${pick}"]`).focus()});
  $('#setchair')&&($('#setchair').onclick=()=>{const nm=L[pick].name;confirmDlg({title:nm+' 위원을 위원장으로 지정할까요?',body:'위원장은 모든 위원이 점수를 낸 뒤 결과를 확인하고 제출해요.',ok:'지정하기',onOk:()=>{chair=pick;render();toast(nm+' 위원을 위원장으로 지정했어요')}})});
}
const PRE={ok:['시작 전 · 통과',()=>{scn='ok';started=false;chair=null;pick=null}],few:['시작 전 · 인원 모자람',()=>{scn='few';started=false;chair=null;pick=null}],run:['시작 후 · 위원장 고르기',()=>{scn='ok';started=true;chair=null;pick=null}],done:['위원장 지정 후',()=>{scn='ok';started=true;chair=0;pick=0}]};
$('#presets').innerHTML=Object.entries(PRE).map(([k,v],i)=>`<button type="button" data-pre="${k}" aria-pressed="${i===0}">${v[0]}</button>`).join('');
$$('[data-pre]').forEach(b=>b.onclick=()=>{PRE[b.dataset.pre][1]();$$('[data-pre]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
render();

</script>
</body>
</html>
